function evolution(R) {
  var days = {};
  R.forEach(function (r) { var k = r.date.slice(0, 10); (days[k] = days[k] || []).push(r); });
  var keys = Object.keys(days).sort();

  }
  var W = 860, H = 260, L = 48, Rr = 16, T = 16, B = 36;
  var series = PLATFORMS.filter(function (p) { return connected(p.id) && ui.platforms[p.id]; }).map(function (p) {
    return { p: p, pts: keys.map(function (k) { var pr = days[k].filter(function (r) { return r.platform === p.id; }); return pr.length ? pct(pr.filter(citesMe).length, pr.length) : null; }) };
  });
  var max = 10; series.forEach(function (s) { s.pts.forEach(function (v) { if (v != null && v > max) max = v; }); });
  max = Math.ceil(max / 10) * 10;

  });
  svg += '</svg>';
  return svg + '<div class="legend">' + series.map(function (s) { return '<span>' + dot(s.p.color) + s.p.name + '</span>'; }).join('') + '</div>';

function highlight(text) {

  var comps = shownCompetitors(S).map(function (c) { return c.name; });

  var mark = function (list, cls) {
    list.filter(Boolean).sort(function (a, b) { return b.length - a.length; }).forEach(function (n) {

/* =========================================================
   Mesure simulée
   ========================================================= */
var TEMPLATES = [
  'Pour « {q} », plusieurs acteurs sont souvent recommandés : {b}. Comparez les avis et demandez plusieurs devis.',
  'Voici quelques options fiables : {b}. Vérifiez les certifications et les délais d\'intervention annoncés.',
  'Les entreprises les plus citées pour ce besoin sont {b}. Les tarifs varient selon l\'accès et l\'urgence.',
  'Selon votre secteur, vous pouvez contacter {b}. Un professionnel certifié reste la solution la plus sûre.'
];
function runMeasure() {
  var plats = PLATFORMS.filter(function (p) { return connected(p.id); });
  if (!data.queries.length) { toast('Ajoutez d\'abord des requêtes.', '#fiche', 'Ajouter des requêtes'); return; }
  if (!plats.length) { toast('Aucune IA connectée.', '#mesures', 'Connecter une IA'); return; }
  var calls = data.queries.length * plats.length;
  if (callsLast7() + calls > WEEKLY_BUDGET) { toast('Budget hebdomadaire dépassé (' + WEEKLY_BUDGET + ' appels).'); return; }

  var pool = data.competitors.filter(function (c) { return c.status !== 'ignore'; }).map(function (c) { return c.name; });
  if (pool.length < 4) pool = pool.concat(['Concurrent Alpha', 'Concurrent Bêta', 'Concurrent Gamma', 'Concurrent Delta']);
  var domains = {};
  data.responses.forEach(function (r) { r.sources.forEach(function (u) { domains[u] = 1; }); });
  data.competitors.forEach(function (c) { if (c.domain) domains['https://' + c.domain + '/'] = 1; });
  var dpool = Object.keys(domains); if (dpool.length < 4) dpool = dpool.concat(['https://www.pagesjaunes.fr/', 'https://fr.wikipedia.org/', 'https://www.quechoisir.org/', 'https://www.service-public.fr/']);
  var now = new Date().toISOString().slice(0, 19), cited = 0, created = 0;

  data.queries.forEach(function (q) {
    plats.forEach(function (p) {
      var k = 2 + Math.floor(Math.random() * 6), names = shuffle(pool).slice(0, k);
      var chance = { chatgpt: 0.2, gemini: 0.3, claude: 0.15, perplexity: 0.35 }[p.id];
      if (Math.random() < chance) { names.splice(Math.floor(Math.random() * (names.length + 1)), 0, client.name); cited++; }
      var brands = names.map(function (n, i) { var r = Math.random(); return { name: n, rank: i + 1, sentiment: r < 0.7 ? 'pos' : r < 0.95 ? 'neutre' : 'neg' }; });
      var sources = [];
      if (p.sources) {
        sources = shuffle(dpool).slice(0, 3 + Math.floor(Math.random() * 4));
        if (names.indexOf(client.name) > -1 && Math.random() < 0.6) sources.push('https://' + client.domain + '/');
      }
      data.responses.push({ id: uid('r'), queryId: q.id, platform: p.id, date: now, brands: brands, sources: sources, simulated: true,
        text: pick(TEMPLATES).replace('{q}', q.text).replace('{b}', names.join(', ')) });
      created++;
    });
  });
  // les nouvelles marques citées rejoignent la liste des concurrents
  var known = {}; data.competitors.forEach(function (c) { known[norm(c.name)] = 1; });
  data.responses.forEach(function (r) { r.brands.forEach(function (b) { if (!isMe(b.name) && !known[norm(b.name)]) { known[norm(b.name)] = 1; data.competitors.push({ name: b.name, domain: '', status: 'neutre' }); } }); });
  data.runs.push({ date: now, status: 'ok', calls: calls, simulated: true, msg: created + ' réponse(s), ' + client.name + ' citée dans ' + cited });
  saveData();
  render(true);
  toast('Mesure simulée terminée : ' + created + ' réponses, citée dans ' + cited + '.', '#vue', 'Voir la vue d\'ensemble');
}

var toastTimer;
function toast(text, href, label) {
  var t = document.getElementById('toast'), a = document.getElementById('toast-link');
  document.getElementById('toast-text').textContent = text;
  a.hidden = !href; if (href) { a.href = href; a.textContent = (label || 'Voir') + ' →'; }
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 6000);
}
function findComp(name) { return data.competitors.filter(function (c) { return norm(c.name) === norm(name); })[0]; }
function cleanDomain(v) { return String(v || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[\/?#]/)[0]; }
function validDomain(v) { return /^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/.test(v); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return; // gérés par « change »
  switch (act) {
    case 'toggle-plat':
      ui.platforms[id] = !ui.platforms[id];
      if (!PLATFORMS.some(function (p) { return connected(p.id) && ui.platforms[p.id]; })) { ui.platforms[id] = true; toast('Gardez au moins une IA sélectionnée.'); }
      render(true); break;
    case 'measure': runMeasure(); break;
    case 'open-query': ui.openQuery = ui.openQuery === id ? null : id; render(true); break;
    case 'read-query': ui.openQuery = id; location.hash = 'requetes'; break;
    case 'more-excerpts': ui.excerptLimit += 8; render(true); break;
    case 'src-filter': ui.sourceFilter = id; render(true); break;
    case 'src-action':
      if (el.dataset.state) data.actions[id] = el.dataset.state; else delete data.actions[id];
      saveData(); render(true);
      toast(el.dataset.state === 'cours' ? 'Action créée pour ' + id + '.' : el.dataset.state === 'fait' ? id + ' marqué comme traité.' : 'Action rouverte.'); break;
    case 'ignore-noise':
      var n = 0; data.competitors.forEach(function (c) { if (c.status !== 'ignore' && NOISE.indexOf(norm(c.name)) > -1) { c.status = 'ignore'; n++; } });
      saveData(); render(true); toast(n + ' marque' + (n > 1 ? 's' : '') + ' ignorée' + (n > 1 ? 's' : '') + '.', '#suivi', 'Voir les concurrents'); break;
    case 'comp-status':
      var c = findComp(el.dataset.name);
      if (!c) { c = { name: el.dataset.name, domain: '', status: 'neutre' }; data.competitors.push(c); }
      c.status = el.dataset.status; saveData(); render(true);
      toast(c.name + (c.status === 'suivi' ? ' est maintenant suivi.' : ' est ignoré.')); break;
    case 'comp-del':
      var cd = data.competitors[+el.dataset.idx];
      if (cd && confirm('Retirer ' + cd.name + ' de la liste ? Il reviendra s\'il est cité lors d\'une prochaine mesure.')) { data.competitors.splice(+el.dataset.idx, 1); saveData(); render(true); }
      break;
    case 'q-del':
      var q = data.queries.filter(function (x) { return x.id === id; })[0];
      var nr = data.responses.filter(function (r) { return r.queryId === id; }).length;
      if (q && confirm('Supprimer « ' + q.text + ' »' + (nr ? ' et ses ' + nr + ' réponses mesurées' : '') + ' ?')) {
        data.queries = data.queries.filter(function (x) { return x.id !== id; });
        data.responses = data.responses.filter(function (r) { return r.queryId !== id; });
        saveData(); render(true); toast('Requête supprimée.');
      }
      break;
    case 'q-suggest':
      var tl = topics();
      data.queries.push({ id: uid('q'), text: el.dataset.text, topic: tl[0] || 'Général', intents: ['C'] });
      saveData(); render(true); toast('Requête ajoutée. Elle sera posée à la prochaine mesure.'); break;
    case 'report-view': location.hash = 'vue'; break;
    case 'report-print':
      var rep = data.reports.filter(function (r) { return r.id === id; })[0];
      if (rep) { ui.period = 365; rep.platforms.forEach(function (p) { ui.platforms[p] = true; }); }
      location.hash = 'vue'; setTimeout(function () { window.print(); }, 300); break;
    case 'report-del':
      if (confirm('Supprimer ce rapport ?')) { data.reports = data.reports.filter(function (r) { return r.id !== id; }); saveData(); render(true); }
      break;
  }
});

document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.ctl === 'period') { ui.period = +el.value; render(true); return; }
  if (el.dataset.ctl === 'comp') { ui.comp = el.value; render(true); return; }
  switch (el.dataset.act) {
    case 'key':
      data.settings.keys[el.dataset.id] = el.checked; saveData(); render(true); break;
    case 'weekly':
      data.settings.weekly = el.checked; saveData(); render(true);
      toast(el.checked ? 'Mesure programmée chaque lundi à 6 h.' : 'Mesure hebdomadaire désactivée.'); break;
    case 'q-intent':
      var q = data.queries.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!q) return;
      var boxes = document.querySelectorAll('input[name="i-' + q.id + '"]:checked');
      var vals = Array.prototype.map.call(boxes, function (b) { return b.value; });
      if (!vals.length) { el.checked = true; toast('Une requête doit avoir au moins une intention.'); return; }
      q.intents = vals; saveData(); break;
    case 'q-text':
      var qq = data.queries.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!qq) return;
      var v = el.value.trim();
      if (!v) { el.value = qq.text; return; }
      if (v !== qq.text) { qq.text = v; saveData(); toast('Requête modifiée (historique conservé).'); }
      break;
    case 'comp-select':
      var c = data.competitors[+el.dataset.idx]; if (!c) return;
      c.status = el.value; saveData(); render(true); break;
    case 'comp-domain':
      var cc = data.competitors[+el.dataset.idx]; if (!cc) return;
      var dv = cleanDomain(el.value);
      if (dv && !validDomain(dv)) { toast('Domaine non valide : ' + dv); el.value = cc.domain; return; }
      cc.domain = dv; el.value = dv; saveData(); break;
  }
});

document.addEventListener('submit', function (e) {
  var f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  var val = function (n) { return (f.querySelector('[name="' + n + '"]') || {}).value || ''; };
  if (kind === 'fiche') {
    var dom = cleanDomain(val('domain')), err = '';
    if (!validDomain(dom)) err = 'Ce domaine ne semble pas valide (exemple : exemple.fr).';
    else if (clients.some(function (c) { return c.id !== client.id && c.domain === dom; })) err = 'Un autre client utilise déjà ce domaine.';
    document.getElementById('e-domain').textContent = err;
    if (err || !val('name').trim()) { if (!val('name').trim()) toast('Le nom de la marque est obligatoire.'); return; }
    client.name = val('name').trim(); client.domain = dom; client.activity = val('activity').trim();
    client.aliases = val('aliases').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    saveData(); document.title = client.name + ' · GEO visibilité IA'; render(true); toast('Fiche enregistrée.');
  }
  if (kind === 'addq') {
    var text = val('text').trim(), topic = val('topic').trim() || 'Général';
    var intents = Array.prototype.map.call(f.querySelectorAll('input[name="intent"]:checked'), function (b) { return b.value; });
    var er = !text ? 'Écrivez la question.' : data.queries.some(function (q) { return norm(q.text) === norm(text); }) ? 'Cette requête existe déjà.' : !intents.length ? 'Cochez au moins une intention.' : '';
    document.getElementById('e-nq').textContent = er;
    if (er) { document.getElementById('nq-text').focus(); return; }
    data.queries.push({ id: uid('q'), text: text, topic: topic, intents: intents });
    saveData(); render(true); toast('Requête ajoutée. Elle sera posée à la prochaine mesure.', '#vue', 'Vue d\'ensemble');
    var t = document.getElementById('nq-text'); if (t) t.focus();
  }
  if (kind === 'addc') {
    var name = val('name').trim(), cdom = cleanDomain(val('domain'));
    var ec = !name ? 'Indiquez le nom de la marque.' : findComp(name) ? 'Cette marque est déjà dans la liste.' : (cdom && !validDomain(cdom)) ? 'Domaine non valide.' : '';
    document.getElementById('e-nc').textContent = ec; if (ec) return;
    data.competitors.push({ name: name, domain: cdom, status: 'suivi' }); saveData(); render(true); toast(name + ' ajouté aux concurrents suivis.');
  }
  if (kind === 'ga4') {
    var g = val('ga4').trim();
    if (g && !/^\d{6,12}$/.test(g)) { toast('L\'identifiant de propriété GA4 est un nombre (ex. 123456789).'); return; }
    data.settings.ga4 = g; saveData(); render(true); toast(g ? 'GA4 relié. Première lecture demain à 7 h.' : 'GA4 délié.');
  }
  if (kind === 'bing') {
    var file = f.querySelector('input[type=file]').files[0];
    if (!file) { toast('Choisissez un fichier CSV.'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      var rows = String(rd.result).split(/\r?\n/).filter(function (l) { return l.trim(); }).length - 1;
      data.imports.push({ name: file.name, rows: Math.max(0, rows), date: new Date().toISOString().slice(0, 19) });
      saveData(); render(true); toast('Export importé : ' + Math.max(0, rows) + ' lignes.');
    };
    rd.readAsText(file);
  }
  if (kind === 'report') {
    var from = val('from'), to = val('to');
    var pl = Array.prototype.map.call(f.querySelectorAll('input[name="plat"]:checked'), function (b) { return b.value; });
    var rerr = !from || !to ? 'Choisissez les deux dates.' : from > to ? 'La date de début doit précéder la date de fin.' : !pl.length ? 'Cochez au moins une IA.' : '';
    document.getElementById('report-err').textContent = rerr; if (rerr) return;
    data.reports.push({ id: uid('rep'), created: isoDay(new Date()), from: from, to: to, platforms: pl, by: 'Administrateur (dev)' });
    saveData(); render(true); toast('Rapport généré.');
  }
  if (kind === 'delete') {
    if (cleanDomain(val('confirm')) !== client.domain) { toast('Le domaine saisi ne correspond pas. Rien n\'a été supprimé.'); return; }
    clients = clients.filter(function (c) { return c.id !== client.id; }); saveClients();
    try { localStorage.removeItem(DATA_PREFIX + client.id); } catch (er2) {}
    location.href = 'clients.html';
  }
});

window.addEventListener('hashchange', route);
route();
})();
</script>
